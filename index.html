<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brandon Shin · Software Engineer</title>
    <meta
      name="description"
      content="Brandon Shin, a software engineer and UC Irvine Master's student who builds AI agents, full-stack apps, and games."
    />
    <link rel="canonical" href="https://www.bmshin.com/" />

    <!-- Link previews (LinkedIn, iMessage, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bmshin.com/" />
    <meta property="og:title" content="Brandon Shin · Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building AI agents, full-stack apps, and games."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Pixel font for the name and headings (see index.css) -->
    <link
      rel="preload"
      href="/fonts/Jersey20-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Apply the saved theme before first paint to avoid a light-mode flash. Keep in sync with ThemeToggle. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
